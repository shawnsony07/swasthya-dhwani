[project]
name = "swasthya-dhwani"
version = "0.1.0"
description = "Swasthya-Dhwani x FluentPath triage spine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fhir.resources>=7.1",
    "google-genai>=0.3",
    "mcp>=1.0",
    "livekit-agents==1.6.1",
    "livekit-plugins-sarvam==1.5.4",
    "livekit-plugins-google==1.3.10",
    "python-jose[cryptography]>=3.3",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "jiwer>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (flake8-bugbear) flags `Depends(...)` in a default argument as a
# risky function-call-in-default-arg pattern. That is exactly how FastAPI
# itself documents dependency injection (`Depends(get_db)` etc.) — the
# "mutable default" footgun B008 exists to catch doesn't apply here, since
# FastAPI special-cases `Depends` at call time rather than evaluating it
# once at function-definition time. Ignored so src/swasthya/api/ doesn't
# need a `# noqa: B008` on every endpoint signature.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
